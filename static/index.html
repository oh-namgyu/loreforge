<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>loreforge</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <h1 class="brand"><a class="brand-link" href="#/">lore<span class="brand-em">forge</span></a></h1>
    <p class="tagline">character &amp; world bible studio</p>
  </header>

  <main class="wrap">
    <div class="notice hidden" id="notice"></div>

    <div id="view-home">
    <section class="panel panel-forge">
      <div class="panel-head">
        <h2 class="panel-title">New Book</h2>
        <span class="hint">One concept in, a whole bible out.</span>
      </div>
      <form id="new-book-form">
        <label class="label" for="f-concept">Concept</label>
        <textarea class="input input-hero" id="f-concept" rows="3" maxlength="4000" required
                  placeholder="one line about the character or world"></textarea>
        <p class="helper">A name, a place, a job, a mood — one line is enough to start the fire.</p>
        <div class="form-row">
          <div class="field">
            <label class="label" for="f-style">Art style</label>
            <input class="input" id="f-style" maxlength="200" placeholder="ink wash, cel shaded, …">
          </div>
          <div class="field">
            <label class="label" for="f-density">Board density</label>
            <select class="input" id="f-density">
              <option value="6">6 sections</option>
              <option value="8">8 sections</option>
            </select>
          </div>
          <div class="field">
            <label class="label" for="f-lang">Body language</label>
            <select class="input" id="f-lang">
              <option value="en">English</option>
              <option value="ko">Korean</option>
            </select>
          </div>
        </div>
        <div class="form-actions">
          <button class="btn btn-primary" type="submit" id="f-submit">Create &amp; Generate</button>
          <span class="form-note" id="form-note"></span>
        </div>
      </form>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2 class="panel-title">Books</h2>
        <span class="badge" id="book-count">0</span>
      </div>
      <div class="grid" id="book-grid"></div>
      <p class="empty" id="book-empty">No books yet — give the forge a concept.</p>
    </section>
    </div>

    <div class="hidden" id="view-detail">
      <div class="actionbar">
        <a class="btn" href="#/" id="detail-back-link">&larr; Books</a>
        <h2 class="detail-title" id="detail-title"></h2>
        <span class="pill" id="detail-status">empty</span>
        <span class="spacer"></span>
        <button class="btn btn-primary" type="button" id="detail-generate">Generate</button>
        <button class="btn" type="button" id="detail-render" disabled>Render Board</button>
        <button class="btn" type="button" id="detail-export" disabled
                title="Download a standalone HTML lorebook">Export</button>
      </div>
      <div class="actionbar actionbar-sub">
        <span class="field-label">Render</span>
        <label class="check" for="kind-board">
          <input type="checkbox" id="kind-board" checked> board
        </label>
        <label class="check" for="kind-solo">
          <input type="checkbox" id="kind-solo"> solo
        </label>
        <span class="spacer"></span>
        <span class="form-note" id="render-cost">Uses your image-API credits (&asymp;1 call per image)</span>
      </div>
      <div class="split">
        <nav class="sidenav" id="detail-nav"></nav>
        <div class="sections" id="detail-sections"></div>
      </div>
    </div>
  </main>

  <script src="/static/app.js"></script>
  <script src="/static/nav.js"></script>
  <script src="/static/gallery.js"></script>
  <script src="/static/detail.js"></script>
</body>
</html>
