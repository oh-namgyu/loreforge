name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: unit (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # requirements-dev.txt already includes -r requirements.txt.
      # No browser download here: the unit suite never opens one.
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  e2e:
    name: e2e (chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: playwright install --with-deps chromium
      # The suite boots a real app.py with LOREFORGE_FAKE_LLM=1 — no keys needed.
      - run: python -m pytest e2e -q

  docker:
    name: docker build + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t loreforge:ci .
      - name: Run and smoke-test the auth gate
        run: |
          docker run -d --name loreforge-ci \
            -e AUTH_TOKEN=ci-smoke-token \
            -p 127.0.0.1:16180:6180 loreforge:ci
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:16180/api/books || true)
            if [ "$code" = "401" ]; then ok=1; break; fi
            sleep 1
          done
          docker logs loreforge-ci
          docker rm -f loreforge-ci
          if [ -z "$ok" ]; then
            echo "expected 401 from /api/books in auth mode, last code: $code"
            exit 1
          fi
